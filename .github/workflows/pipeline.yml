name: YouTube Shorts Auto Pipeline

# Runs once a day. Times are in UTC.
# You can also click "Run workflow" in the Actions tab to run it manually.
on:
  schedule:
    - cron: "0 20 * * *"   # once a day, ~4pm US Eastern
  workflow_dispatch: {}

# Never let two runs overlap (prevents duplicate topics)
concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  make-and-upload-short:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube login token
        run: echo "${{ secrets.YT_TOKEN_PICKLE_B64 }}" | base64 -d > token.pickle

      - name: Restore YouTube client secret
        run: echo "${{ secrets.YT_CLIENT_SECRET_B64 }}" | base64 -d > client_secret.json

      - name: Run full pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 run_pipeline.py

      - name: Save used-topics list back to the repo
        if: always()
        run: |
          git config user.name "facts-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_topics.json
          if [ -f generated_topics.json ]; then git add generated_topics.json; fi
          git diff --cached --quiet || git commit -m "Update used topics list [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
